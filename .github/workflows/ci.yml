name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, build, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # [18,20,22] → [22,24] on 2026-09-06 (npm-dependency-policy pass,
        # normalizing toward production's Dockerfile) silently dropped
        # coverage of this package's own declared engines.node floor. Node
        # 18 is EOL (engines bumped to >=20 same day as this fix, 2026-09-09)
        # so [20, 24] is real coverage, not a stale unmaintained-runtime test.
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # systems/npm-dependency-policy rules 2+3 — pin an exact npm version and
      # make an unapproved install script a hard CI failure instead of npm
      # 12's silent skip. Missing entirely until 2026-09-09 (systems/github-ci).
      - name: Pin npm version
        run: npm install -g npm@12.0.2

      - name: Enforce allowScripts in CI
        run: npm config set strict-allow-scripts true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov-report
