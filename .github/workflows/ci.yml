name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, build, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 reached end of life on 2026-04-30, and the pinned npm 12 below
        # requires Node ^22.22.2 || ^24.15.0 || >=26, so a Node 20 leg cannot even
        # install. The tested floor is therefore 22; engines.node says the same.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # systems/npm-dependency-policy rules 2+3 — pin an exact npm version and
      # make an unapproved install script a hard CI failure instead of npm
      # 12's silent skip. Missing entirely until 2026-09-09 (systems/github-ci).
      - name: Pin npm version
        run: npm install -g npm@12.0.2

      - name: Enforce allowScripts in CI
        run: npm config set strict-allow-scripts true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report
